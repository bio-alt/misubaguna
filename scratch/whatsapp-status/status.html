<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#10202a;color:#fff;position:relative}
  .top{background:#fff;height:230px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;box-sizing:border-box}
  .top img{height:100px}
  .body{padding:56px 90px 0}
  .row{display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:30px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#7fd3d6;border:2px solid #2f8f94;border-radius:8px;padding:12px 22px}
  .free{background:#fff;color:#10202a;font-size:54px;font-weight:800;letter-spacing:3px;padding:14px 30px;border-radius:10px;transform:rotate(-4deg)}
  h1{font-size:108px;line-height:1.02;font-weight:800;margin:40px 0 0;letter-spacing:-2px}
  h1 span{color:#5cc4c8}
  svg{display:block;margin:40px auto 44px}
  .modes{display:flex;flex-direction:column;gap:26px}
  .mode{border:2px solid #2f8f94;border-radius:14px;padding:30px 36px}
  .mode.hl{background:#176b70;border-color:#176b70}
  .mode .n{font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#7fd3d6}
  .mode.hl .n{color:#bfe6e7}
  .mode .t{font-size:54px;font-weight:800;margin:6px 0 10px}
  .mode .d{font-size:34px;line-height:1.35;color:#c9dadb;font-weight:500}
  .mode.hl .d{color:#e3f3f3}
  .cta{position:absolute;left:90px;right:90px;bottom:170px;text-align:center}
  .cta .big{font-size:76px;font-weight:800;color:#fff;letter-spacing:1px}
  .cta .big span{color:#5cc4c8}
  .cta .u{font-size:44px;font-weight:700;margin-top:14px;color:#c9dadb}
</style></head><body>
<div class="top"><img src="misuba-logo.png" alt="Misuba Guna"></div>
<div class="body">
  <div class="row">
    <span class="tag">New online tool</span>
    <span class="free">FREE!</span>
  </div>
  <h1>EJMA Bellows <span>Calculator</span></h1>

  <svg width="900" height="150" viewBox="0 0 900 170" fill="none">
    <rect x="0" y="62" width="150" height="46" fill="#24414c"/>
    <rect x="750" y="62" width="150" height="46" fill="#24414c"/>
    <path d="M150 62 C150 10,190 10,190 62 C190 10,230 10,230 62 C230 10,270 10,270 62 C270 10,310 10,310 62 C310 10,350 10,350 62 C350 10,390 10,390 62 C390 10,430 10,430 62 C430 10,470 10,470 62 C470 10,510 10,510 62 C510 10,550 10,550 62 C550 10,590 10,590 62 C590 10,630 10,630 62 C630 10,670 10,670 62 C670 10,710 10,710 62 C710 10,750 10,750 62" stroke="#5cc4c8" stroke-width="7"/>
    <path d="M150 108 C150 160,190 160,190 108 C190 160,230 160,230 108 C230 160,270 160,270 108 C270 160,310 160,310 108 C310 160,350 160,350 108 C350 160,390 160,390 108 C390 160,430 160,430 108 C430 160,470 160,470 108 C470 160,510 160,510 108 C510 160,550 160,550 108 C550 160,590 160,590 108 C590 160,630 160,630 108 C630 160,670 160,670 108 C670 160,710 160,710 108 C710 160,750 160,750 108" stroke="#5cc4c8" stroke-width="7"/>
  </svg>

  <div class="modes">
    <div class="mode">
      <div class="n">01 · Check</div>
      <div class="t">Check my design</div>
      <div class="d">Enter your convolution geometry. We check it against the EJMA Standards.</div>
    </div>
    <div class="mode hl">
      <div class="n">02 · Design</div>
      <div class="t">Design it for me</div>
      <div class="d">Just enter your service conditions. Our system designs the bellows for you.</div>
    </div>
  </div>
</div>
<div class="cta">
  <div class="big">100% <span>FREE</span>. Try it now!</div>
  <div class="u">misubaguna.com/toolkit</div>
</div>
</body></html>
